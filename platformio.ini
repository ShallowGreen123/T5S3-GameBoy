[platformio]
default_envs = T5S3-GameBoy
boards_dir = boards

[version]
Version = 1.2.2

[env:T5S3-GameBoy]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = deep+
extra_scripts = post:scripts/merge_firmware.py

build_unflags =
    -Os

build_flags =
    -O3
    -DPAPERBOY_FIRMWARE_VERSION=\"${version.version}\"
    -DBOARD_HAS_PSRAM
    -DPSRAM_SPEED=120MHz
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
    -Ilib/I2CMasterCompat/include

lib_deps =
    Wire
